# =============================================================
#  V9 PLUS 통합 설정 — config_v9.yaml
#  한국(KR) + 미국(US) 자동매매 전체 제어
# =============================================================

# -------------------------------------------------------------
# 공통 기본 설정
# -------------------------------------------------------------
system:
  timezone: "Asia/Seoul"
  mode: "SIM"        # SIM or LIVE
  log_dir: "logs"
  heartbeat_sec: 2

# -------------------------------------------------------------
# 브로커 설정 (Alpaca + Kiwoom)
# -------------------------------------------------------------
brokers:
  alpaca:
    key: "YOUR_ALPACA_API_KEY"
    secret: "YOUR_ALPACA_SECRET_KEY"
    endpoint: "https://paper-api.alpaca.markets"   # LIVE 시 변경
  kiwoom:
    appid: ""
    account: ""

# -------------------------------------------------------------
# 한국 장(KR) 설정
# -------------------------------------------------------------
KR:
  enabled: true
  market: "KR"
  time_window:
    start: "08:55:00"
    end: "15:35:00"

  # 데이터 엔진
  data:
    universe_size: 400
    interval_sec: 3
    include_etf: false

  # 시장 레짐 판단
  regime:
    window: 60
    threshold:
      bull: 0.7
      bear: -0.7
      side: 0.3

  # 시그널 엔진 (멀티전략)
  signals:
    mean_reversion: true
    panic_reversal: true
    orderflow: true
    bull_engines: true
    bear_engines: true
    breakout_scalping: true
    ml_gate: true

  # 포지션 / 리스크 관리
  portfolio:
    max_positions: 2
    risk_per_trade: 0.5   # %
    take_profit: 2.5       # %
    stop_loss: 0.7         # %
    cooldown_sec: 120
    trailing_stop: false

# -------------------------------------------------------------
# 미국 장(US) 설정
# -------------------------------------------------------------
US:
  enabled: true
  market: "US"
  time_window:
    start: "23:30:00"
    end: "06:00:00"

  data:
    universe_size: 300
    interval_sec: 3
    include_etf: false

  regime:
    window: 60
    threshold:
      bull: 0.7
      bear: -0.7
      side: 0.3

  signals:
    mean_reversion: true
    panic_reversal: true
    orderflow: true
    bull_engines: true
    bear_engines: true
    breakout_scalping: true
    ml_gate: true

  portfolio:
    max_positions: 2
    risk_per_trade: 0.5
    take_profit: 2.5
    stop_loss: 0.7
    cooldown_sec: 120
    trailing_stop: false

# -------------------------------------------------------------
# ML Gate (머신러닝 시그널 필터)
# -------------------------------------------------------------
ml_gate:
  enabled: true
  model_path: "ml_models/model_v9.pkl"
  min_score: 0.55

# -------------------------------------------------------------
# 로그/알림
# -------------------------------------------------------------
notifications:
  telegram:
    enabled: false
    bot_token: ""
    chat_id: ""

backup:
  enabled: true
  interval_min: 10
  dir: "backup"

# =============================================================
# END OF FILE
# =============================================================
