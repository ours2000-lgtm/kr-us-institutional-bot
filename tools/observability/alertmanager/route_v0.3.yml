route:
  group_by: ['service', 'team', 'incident_key']
  group_wait: 10s
  group_interval: 2m
  repeat_interval: 30m
  receiver: "default"

  routes:
    - matchers:
        - severity="critical"
      receiver: "oncall"
      repeat_interval: 15m

    - matchers:
        - severity="warning"
      receiver: "slack-ops"
      repeat_interval: 60m

    - matchers:
        - severity="info"
      receiver: "log-only"
      repeat_interval: 6h

receivers:
  - name: "default"
  - name: "oncall"
  - name: "slack-ops"
  - name: "log-only"