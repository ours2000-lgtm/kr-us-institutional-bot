# ============================================================
# LRScheduler V22 Configuration
# 시장별 기본 학습률, 세션별 multiplier, joint multiplier,
# reward 기반 scaling, MAD 정규화 등 포함
# ============================================================

# ------------------------------------------------------------
# 시장별 기본 학습률
# KR / US / CRYPTO 각각 독립적으로 조정 가능
# ------------------------------------------------------------
base_lr:
  KR: 0.015
  US: 0.012
  CRYPTO: 0.020

# ------------------------------------------------------------
# 시장별 학습률 허용 범위
# min/max를 시장별로 다르게 설정해 안정성 확보
# ------------------------------------------------------------
lr_range:
  KR: { min: 0.0005, max: 0.05 }
  US: { min: 0.0005, max: 0.05 }
  CRYPTO: { min: 0.0001, max: 0.10 }   # 변동성 크므로 max 확대

# ------------------------------------------------------------
# 세션별 multiplier
# session 문자열은 모두 lower-case로 통일
# ------------------------------------------------------------
session_mult:
  open: 0.80
  close: 0.75
  asia: 1.10
  euro: 1.00
  us: 0.90
  overnight: 0.95

# ------------------------------------------------------------
# Market-level multiplier
# 전체 시장 상태가 LR에 영향을 주도록 확장
# ------------------------------------------------------------
market_mult:
  KR: 1.00
  US: 1.00
  CRYPTO: 1.20   # 24h 시장이므로 더 민감하게

# ------------------------------------------------------------
# Market + Session 조합별 multiplier (joint)
# 두 가지 방식 모두 지원함 (문자열 키 + 중첩 dict)
# ------------------------------------------------------------
joint_mult:
  "KR-open": 0.85
  "KR-close": 0.75
  "US-open": 0.90
  "US-close": 0.70
  CRYPTO:
    asia: 1.15
    us: 1.05
    overnight: 1.10

# ------------------------------------------------------------
# Warm-up 설정
# 시장별로 다르게 적용 가능
# ------------------------------------------------------------
warmup_steps:
  KR: 200
  US: 200
  CRYPTO: 100     # 더 빠른 적응 필요하므로 짧게 설정

# Warm-up 동안 학습률을 점진적으로 증가시키는 옵션
warmup_curve: "linear"   # linear | constant

# ------------------------------------------------------------
# Reward Normalization
# V22에서는 MAD 윈도우 기반 정규화
# MAD가 너무 작으면 안전하게 1.0으로 보정
# ------------------------------------------------------------
mad_window: 5000
mad_floor: 1e-6

# EMA smoothing for reward stability
ema_alpha: 0.05

# ------------------------------------------------------------
# Performance scaling
# Sharpe / Drawdown / Win-rate 영향도를 조절
# ------------------------------------------------------------
perf_weight:
  sharpe: 0.50
  dd:     0.30
  win:    0.20

# ------------------------------------------------------------
# Debugging Options
# True 설정 시 각 multiplier 구성 요소를 모두 로그로 반환
# ------------------------------------------------------------
debug: true
