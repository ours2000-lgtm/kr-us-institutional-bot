# =====================================================================
# V10 CONFIG — Unified Settings (KR / US / CRYPTO)
# =====================================================================

# ---------------------------------------------------------
# 공통 설정
# ---------------------------------------------------------
ENGINE:
  interval: 1.0
  timezone: "Asia/Seoul"

# ---------------------------------------------------------
# 포트폴리오 엔진
# ---------------------------------------------------------
PORTFOLIO:
  vol_target: 0.02          # 일간 2%
  vol_window: 30
  annualize_vol: false

  max_leverage: 1.2
  max_position_pct: 0.18
  min_cash_ratio: 0.10

  crash_reduce_ratio: 0.50
  dd_soft: 0.08
  dd_hard: 0.12
  loss_streak_soft: 5

# ---------------------------------------------------------
# 실행 엔진 (Executor V10)
# ---------------------------------------------------------
EXECUTOR:
  spread_threshold: 0.002
  micro_risk_factor: 1.2

  min_fragment: 0.12
  max_fragment: 0.28
  delay_base: 0.40
  delay_decay: 0.85

  volatility_cut: 0.006

  max_wait: 5.0
  max_slippage: 0.004
  price_jump_cut: 0.006
  poll_delay: 0.15

  max_retries: 3

# ---------------------------------------------------------
# KR 시장 설정
# ---------------------------------------------------------
KR:
  market: "KR"
  timezone: "Asia/Seoul"
  trading_hours:
    open: "09:00:00"
    close: "15:30:00"

  data_source: "KIWOOM"
  universe_file: "universe_kr.csv"

# ---------------------------------------------------------
# US 시장 설정
# ---------------------------------------------------------
US:
  market: "US"
  timezone: "America/New_York"
  trading_hours:
    open: "09:30:00"
    close: "16:00:00"

  universe_file: "universe_us.csv"
  data_source: "ALPACA"

# ---------------------------------------------------------
# Crypto 시장 설정 (미리 넣어두는 버전)
# ---------------------------------------------------------
CRYPTO:
  market: "CRYPTO"
  timezone: "UTC"
  trading_hours: "24/7"

  data_source: "BINANCE_API"

  universe:
    - "BTC/USDT"
    - "ETH/USDT"

  risk_cap: 85       # % 기준 (주식보다 높게 설정)
  fail_safe: true

  # 나중에 시그널·데이터 엔진을 추가할 때 이 구조 그대로 확장
