# ============================================================
# us_v7_plus.yaml — 미국 자동매매 설정 (V7 PLUS)
# ============================================================

profile_name: "US_V7_PLUS"

mode: "PAPER"            # PAPER / LIVE / SIM
timezone: "Asia/Seoul"

# ------------------------------------------------------------
# 미국 정규장 (한국 기준)
# ------------------------------------------------------------
time_window:
  start: "23:30:00"
  end:   "06:00:00"

# ------------------------------------------------------------
# Data Collector (V7)
# ------------------------------------------------------------
data:
  universe:
    - AAPL
    - MSFT
    - NVDA
    - AMD
    - META
    - AMZN
    - TSLA
    - TQQQ
    - QQQ
    - SQQQ
    - SOXL
    - SOXS
    - RIVN
    - UPST
  refresh_interval: 1.0       # 초 단위 루프 텀

# ------------------------------------------------------------
# Signal Engine
# ------------------------------------------------------------
signal:
  base_threshold: 0.75        # 신호 점수 기준
  max_signals_per_tick: 4     # 한번에 진입 가능한 최대 종목
  strategy_mode: "NORMAL"     # NORMAL / AGG / SAFE

# ------------------------------------------------------------
# Adaptive TP/SL 엔진 (V7 PLUS)
# ------------------------------------------------------------
adaptive:
  enabled: true
  liquidity_factor: 1.0
  volatility_factor: 1.0

# ------------------------------------------------------------
# Portfolio Manager (V7)
# ------------------------------------------------------------
portfolio:
  max_positions: 4            # 최대 보유 종목 수
  max_exposure_pct: 0.45      # 총자산 대비 45% 이상 투자 금지
  initial_equity: 100000      # SIM/PAPER 기준 자산
  
# ------------------------------------------------------------
# Executor PLUS V7
# ------------------------------------------------------------
executor:
  trailing_start_pct: 1.0     # +1% 이상부터 트레일링 가동
  trailing_gap_pct: 0.7       # 최고점 대비 0.7% 아래로 트레일링 스탑
  slippage_pct: 0.05          # 매수/매도 슬리피지 조정 (%)
  imbalance_cut: -40          # 매도압도 심할 때 청산
  liquidity_stress_cut: 60    # 유동성 스트레스 강하면 청산

# ------------------------------------------------------------
# Market Regime (V7 PLUS)
# ------------------------------------------------------------
regime:
  enabled: true

# ------------------------------------------------------------
# Logs
# ------------------------------------------------------------
logs:
  folder: "US_AUTO"
  level: "INFO"
